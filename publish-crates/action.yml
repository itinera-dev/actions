name: Publish to crates.io
description: >-
  Publishes the version of every crate of the Cargo workspace that may be published and is not on crates.io at
  that version already, such as the first version of a crate, which its maintainer publishes by hand, or crates
  published by a run that failed part way. It logs in through crates.io's trusted publishing, so the job needs
  `id-token: write` and a trusted publisher set for the repository on crates.io.

runs:
  using: composite
  steps:
    - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      id: auth
    - shell: bash
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        PYTHONPATH: ${{ github.action_path }}/..
      run: python3 "$GITHUB_ACTION_PATH/main.py"
