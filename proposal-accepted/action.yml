name: Proposal accepted
description: After a pull request merges, closes as completed and locks as resolved the issue of every proposal file (proposals/NNNN-*.md) it added.

inputs:
  token:
    description: Token that can read the pull request and write issues.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
        PYTHONPATH: ${{ github.action_path }}/..
      run: python3 "$GITHUB_ACTION_PATH/main.py"
